// scalar(): converts Creator lookup/object/array values into readable text.
function scalar(v){if(v==null)return"";if(typeof v!=="object")return String(v);if(v.display_value!=null)return scalar(v.display_value);if(v.zc_display_value!=null)return scalar(v.zc_display_value);if(v.email)return String(v.email);if(v.ID!=null)return String(v.ID);const vals=Object.values(v).filter(x=>x!=null&&typeof x!=="object");return vals.join(" ");}
function pick(r,aliases,f=""){if(!r)return f;for(const a of aliases||[])if(Object.prototype.hasOwnProperty.call(r,a))return scalar(r[a]);const keys=Object.fromEntries(Object.keys(r).map(k=>[nk(k),k]));for(const a of aliases||[]){const k=keys[nk(a)];if(k)return scalar(r[k]);}return f;}
function idOf(r){return scalar(r?.ID||r?.id)}
function num(v,f=0){const n=Number(String(v??"").replace(/,/g,""));return Number.isFinite(n)?n:f}
function initials(name){return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"}
function todayIso(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function toCreatorDate(v){if(!v)return"";const p=String(v).split("-");if(p.length!==3)return v;return `${p[2]}-${MONTHS[Number(p[1])-1]}-${p[0]}`}
function toCreatorDateTime(d=new Date()){return `${String(d.getDate()).padStart(2,"0")}-${MONTHS[d.getMonth()]}-${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`}
function toInputDate(v){const s=scalar(v).trim();if(!s)return"";if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/);if(m){const mi=MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase())+1;return `${m[3]}-${String(mi).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;}const d=new Date(s);return Number.isNaN(d.getTime())?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function displayDate(v){const iso=toInputDate(v);return iso?iso.split("-").reverse().join("-"):"—"}

// V18.2: legacy Creator lookup/group fields can be nested objects. These helpers
// inspect every scalar child instead of trusting only the first lookup value.
function deepScalarEntries(value,topKey="",out=[],depth=0){
  if(depth>6||value==null)return out;
  if(typeof value!=="object"){out.push({key:topKey,value:String(value)});return out;}
  if(Array.isArray(value)){value.forEach(v=>deepScalarEntries(v,topKey,out,depth+1));return out;}
  for(const [key,child] of Object.entries(value)){
    const root=topKey||key;
    if(child!=null&&typeof child==="object")deepScalarEntries(child,root,out,depth+1);
    else if(child!=null)out.push({key:root,value:String(child)});
  }
  return out;
}
function valueContainsExactToken(value,needle){
  const n=String(needle||"").trim();if(!n)return false;
  return deepScalarEntries(value,"value").some(({value:v})=>{
    const s=String(v||"").trim();if(s===n)return true;
    return s.split(/[^A-Za-z0-9]+/).filter(Boolean).includes(n);
  });
}
function equipmentRowMatchesProjectCode(row,projectCode){

  for(const alias of EQ_ALIASES.project){if(Object.prototype.hasOwnProperty.call(row,alias)&&valueContainsExactToken(row[alias],projectCode))return true;}

    const k=nk(key);
    if((k==="projectcode"||k.startsWith("projectcode")||k==="project")&&valueContainsExactToken(value,projectCode))return true;
  }
  return false;
}
function bestScalarKey(row,include=[],exclude=[]){
  let best="",score=-1;
  for(const key of Object.keys(row||{})){
    const k=nk(key);if(exclude.some(x=>k.includes(nk(x))))continue;
    let s=0;for(const t of include)if(k.includes(nk(t)))s+=2;
    if(s>score&&s>0){best=key;score=s;}
  }

}

function errorText(e){
  if(e==null)return "Unknown Creator error";
  if(typeof e==="string")return e;
  // Creator SDK rejected promises often expose responseText on a plain object.
  const parts=[];
  try{if(e.message)parts.push(String(e.message))}catch(_){ }
  try{if(e.responseText)parts.push(String(e.responseText))}catch(_){ }
  try{if(e.statusText)parts.push(String(e.statusText))}catch(_){ }
  try{parts.push(JSON.stringify(e))}catch(_){parts.push(String(e))}
  return [...new Set(parts.filter(Boolean))].join(" | ");
}
function creatorErrorCode(e){

}

// extractCreatorFilePath(): Creator record responses for Multiple Upload fields
// can return a complete relative download URL such as:
// /api/v2.1/.../Drawing_File/download?filepath=1788952924226152_Drawing.pdf
// FILE.readFile does NOT want that whole URL. It wants only the exact filepath
// query value, e.g. 1788952924226152_Drawing.pdf.
function extractCreatorFilePath(value){
  let s=String(value||"").trim();
  if(!s)return "";
  s=s.replace(/&amp;/gi,"&");
  const m=s.match(/[?&](?:filepath|file_path)=([^&#]+)/i);
  if(m){
    try{return decodeURIComponent(m[1])}catch(_){return m[1]}
  }
  return s;
}

function creatorDisplayFileName(value){
  const filePath=extractCreatorFilePath(value);
  let name=String(filePath||"").split("/").pop()||String(filePath||"");
  try{name=decodeURIComponent(name)}catch(_){ }
  // Creator prefixes uploaded files with a long numeric unique value.
  // Hide only that technical prefix in the UI.
  name=name.replace(/^\d+_/,"");
  return name||"File";
}

// creatorFileEntries(): normalize Creator single/multiple-file response shapes
// into [{filename, filepath}] without losing the original extension.
function creatorFileEntries(value){
  const out=[];
  const seen=new Set();

  const add=(filename,filepath,downloadUrl="")=>{
    let rawName=String(filename||"").trim();
    let rawPath=String(filepath||"").trim();
    const rawUrl=String(downloadUrl||"").trim();

    // A Creator Multiple Upload field often returns the COMPLETE download URL
    // instead of {filename, filepath}. Extract only the filepath query value.
    const sourceWithPath=rawPath||rawName||rawUrl;
    const exactPath=extractCreatorFilePath(sourceWithPath);

    // If the supplied "filename" itself is a Creator API URL, never show that
    // technical URL to the user. Display only the cleaned file name.
    const nameLooksLikeUrl=/\/api\/|[?&](?:filepath|file_path)=/i.test(rawName);
    let displayName=(!nameLooksLikeUrl&&rawName)?rawName:creatorDisplayFileName(exactPath);
    if(!displayName)displayName=creatorDisplayFileName(exactPath);
    if(!exactPath&&!displayName)return;

    const key=`${displayName}|||${exactPath}`;
    if(seen.has(key))return;
    seen.add(key);
    out.push({
      filename:displayName||"File",
      filepath:exactPath,
      downloadUrl:rawUrl||((/\/api\//i.test(rawPath)||/\/api\//i.test(rawName))?(rawPath||rawName):"")
    });
  };

  const parse=item=>{
    if(item==null||item==="")return;
    if(Array.isArray(item)){item.forEach(parse);return;}

    if(typeof item==="object"){
      const filename=item.filename||item.file_name||item.name||"";
      const filepath=item.filepath||item.file_path||item.path||"";
      const downloadUrl=item.download_url||item.downloadUrl||item.url||"";
      if(filename||filepath||downloadUrl){add(filename,filepath||downloadUrl,downloadUrl);return;}
      if(item.display_value!=null){parse(item.display_value);return;}
      if(item.zc_display_value!=null){parse(item.zc_display_value);return;}
      if(item.value!=null){parse(item.value);return;}
      return;
    }

    const text=String(item).trim();
    if(!text)return;

    if((text.startsWith("[")&&text.endsWith("]"))||(text.startsWith("{")&&text.endsWith("}"))){
      try{parse(JSON.parse(text));return}catch(_){ }
    }

    // Some Creator responses may return several API download URLs in one string.
    // Split only when each part clearly looks like a Creator file URL.
    if(text.includes(",")&&/[?&](?:filepath|file_path)=/i.test(text)){
      text.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>add("",x,x));
      return;
    }

    // Normal Creator Multiple Upload response: a relative download URL.
    if(/\/api\/|[?&](?:filepath|file_path)=/i.test(text)){
      add("",text,text);
      return;
    }

    // Legacy/single-file fallback.
    add(text,text,"");
  };

  parse(value);
  return out;
}

function binaryStringToBlob(content,mime){
  const bytes=new Uint8Array(content.length);
  for(let i=0;i<content.length;i++)bytes[i]=content.charCodeAt(i)&0xff;
  return new Blob([bytes],{type:mime||"application/octet-stream"});
}

/*
  V17.3 FIX:
  Do not hard-code Design_Tracking_Report. Different Creator apps commonly have
  a generated report link such as All_Design_Tracking or Design_Tracking.
  Normal users may also lack META API permission, so we resolve the report only
  by trying DATA.getRecords against known candidates. No META call is required.
*/
async function resolveTrackingSource(){
  if(S.demo)return {report:CONFIG.REPORTS.tracking,rows:await fetchRecords(CONFIG.REPORTS.tracking)};

  // First use the exact report link from the old working widget.
  try{
    const rows=await fetchRecords(CONFIG.REPORTS.tracking,"",20);
    log("tracking-report-resolved",{report:CONFIG.REPORTS.tracking,records:rows.length});
    return {report:CONFIG.REPORTS.tracking,rows};
  }catch(firstError){
    console.warn("Direct Design_Tracking_Report read failed",firstError);

    // Legacy widget fallback: discover the report from Creator metadata when
    // the logged-in user's permission allows META.getReports().
    try{
      if(ZOHO.CREATOR.META&&ZOHO.CREATOR.META.getReports){
        const meta=assertResp(await ZOHO.CREATOR.META.getReports(withApp({})),"Get Reports");
        const reports=meta.reports||[];
        const match=reports.find(r=>{
          const ln=nk(r.link_name||"");
          const dn=nk(r.display_name||"");
          return ln==="designtrackingreport"||ln.includes("designtracking")||dn.includes("designtracking");
        });
        if(match?.link_name){
          const rows=await fetchRecords(match.link_name,"",20);
          CONFIG.REPORTS.tracking=match.link_name;
          log("tracking-report-meta-resolved",{report:match.link_name,records:rows.length});
          return {report:match.link_name,rows};
        }
      }
    }catch(metaError){
      console.warn("META report discovery unavailable",metaError);
    }

    throw firstError;
  }
}

/* ================= V17.14 ASSIGNMENT EMAIL CUSTOM API =================
   One saved assignment -> one email.
   Bulk assignments to the same person -> one summary email.
   Different-people bulk -> one summary email per recipient.
   ======================================================================= */
function notificationAssignmentItem(record){
  return {
    recordId:idOf(record),
    project:scalar(record?.[AF.projectCode]),
    drawing:scalar(record?.[AF.drawingDocument]),
    shortName:scalar(record?.[AF.shortName]),
    responsibility:scopeSummary(record),
    tag:scalar(record?.[AF.tagNo]),
    equipment:scalar(record?.[AF.equipmentName]),
    designType:scalar(record?.[AF.designType]),
    target:displayDate(record?.[AF.targetDate]),
    priority:scalar(record?.[AF.priority])||"Medium"
  };
}
function assignmentEmailSubject(records){
  const first=records[0]||{};
  const project=scalar(first[AF.projectCode]);
  const drawing=scalar(first[AF.shortName])||scalar(first[AF.drawingDocument]);
  if(records.length===1){
    const dt=scalar(first[AF.designType]);
    return `[Design Control] New Assignment${project?` - ${project}`:""}${drawing?` - ${drawing}`:""}${dt?` - ${dt}`:""}`;

}

async function invokeNotificationCustomApi(recipient,subject,html,logAction="design-email"){
  if(!CONFIG.NOTIFICATIONS?.enabled)return {skipped:true};
  if(!recipient?.email||!String(recipient.email).includes("@"))return {skipped:true,reason:"email-missing"};
  if(S.demo){console.info("DEMO design email",recipient,subject);return {demo:true};}
  if(!ZOHO?.CREATOR?.DATA?.invokeCustomApi)throw new Error("Creator Custom API invocation is unavailable. Confirm Widget JS API v2 is loaded.");
  const cfg={api_name:CONFIG.NOTIFICATIONS.assignmentEmailApi,http_method:"POST",content_type:"application/json",payload:{to_email:recipient.email,to_name:recipient.name||recipient.email,subject_text:subject,message_html:html}};
  if(CONFIG.NOTIFICATIONS.workspaceName)cfg.workspace_name=CONFIG.NOTIFICATIONS.workspaceName;
  const response=await ZOHO.CREATOR.DATA.invokeCustomApi(cfg);
  log(logAction,{to:recipient.email,response});
  return response||{status:"sent"};
}
async function invokeAssignmentEmailCustomApi(recipient,records){
  if(!records?.length)return {skipped:true};
  return invokeNotificationCustomApi(recipient,assignmentEmailSubject(records),assignmentEmailHtml(recipient,records),"assignment-email");
}
async function notifyCreatedAssignments(records){
  const valid=(records||[]).filter(Boolean);
  if(!valid.length || !CONFIG.NOTIFICATIONS?.enabled)return {sent:0,failed:0};
  const groups=new Map();
  for(const record of valid){
    const recipient=assignmentRecipientFromRecord(record);
    const key=recipient.email.toLowerCase();
    if(!groups.has(key))groups.set(key,{recipient,records:[]});
    groups.get(key).records.push(record);
  }
  let sent=0,failed=0;
  for(const {recipient,records:rows} of groups.values()){
    try{
      const mail=await invokeAssignmentEmailCustomApi(recipient,rows);
      if(mail?.skipped){toast(`${recipient.name} assigned successfully. Email was skipped because no normal Email is available.`,"warn");continue;}
      sent++;
      toast(`Email sent to ${recipient.name} (${recipient.email})${rows.length>1?` for ${rows.length} assignments`:""}.`,"good");
    }catch(e){
      failed++;
      console.error("Assignment email failed",recipient,e);
      toast(`Assignment saved, but email to ${recipient.name||recipient.email} failed: ${errorText(e)}`,"warn");
      if(!CONFIG.NOTIFICATIONS.failOpen)throw e;
    }
  }
  return {sent,failed};
}

function systemNotificationsForUser(){

  for(const a of myAssignments()){

    const r=currentRevision(a),rs=scalar(r?.[AF.status]);
    if(rs==="Returned")push({id:`returned:${aid}:${idOf(r)}`,assignmentId:aid,icon:"↩",title:"Design Returned",detail:`${scalar(a[AF.projectCode])} • ${dr.short||dr.name} • ${scalar(r?.[AF.returnReason])||"Open the work item for details."}`,time:notificationRecordTime(r),tone:"amber"});
    if(["Approved","Issued"].includes(rs))push({id:`owner-status:${aid}:${idOf(r)}:${rs}`,assignmentId:aid,icon:rs==="Approved"?"✓":"→",title:`Revision ${rs}`,detail:`${scalar(a[AF.projectCode])} • ${dr.short||dr.name} • ${scalar(r?.[AF.revision])||"Current revision"}`,time:notificationRecordTime(r),tone:"green"});
  }

    const r=currentRevision(a);if(!r)continue;const rs=scalar(r[AF.status]),aid=idOf(a),dr=drawingForAssignment(a),base=`${scalar(a[AF.projectCode])} • ${dr.short||dr.name} • ${scopeSummary(a)}`;

function textMatchesQuery(values,q){const raw=String(q||"").trim().toLowerCase(),compact=nk(q);if(!raw)return true;const text=(values||[]).map(v=>scalar(v)).filter(Boolean).join(" | ").toLowerCase();return text.includes(raw)||(compact&&nk(text).includes(compact))}

   The PDS Workspace is a READ-ONLY reference layer inside the selected PDS

function isPdsDrawing(a=S.current){

function pdsTypeConfig(key){return PDS_TYPES.find(x=>x.key===key)||PDS_TYPES[0]}
function pdsStatusValue(row,type){return type==="all"?"":pick(row,PDS_STATUS_ALIASES[type]||["Status"],"")}
function pdsStatusPill(status){
  const s=scalar(status).trim();
  const k=nk(s);
  let cls="";
  if(k.includes("approved")&&!k.includes("under"))cls="green";
  else if(k.includes("underapproval")||k.includes("submitted")||k.includes("approval"))cls="amber";
  else if(k.includes("pending")||k.includes("rejected"))cls="red";
  return `<span class="pill ${cls}">${h(s||"—")}</span>`;
}
function pdsSameValue(actual,expected){
  const a=nk(actual),e=nk(expected);if(!e)return true;if(!a)return false;
  return a===e||a.startsWith(e)||e.startsWith(a);
}
function assignmentScopedEquipment(a){
  if(!a)return[];
  const project=scalar(a[AF.projectCode]),sec=scalar(a[AF.plantSection]),stype=scalar(a[AF.plantSectionType]),tag=scalar(a[AF.tagNo]),group=scalar(a[AF.groupCode]),dept=scalar(a[AF.department]),cat=scalar(a[AF.equipmentCategory]),etype=scalar(a[AF.equipmentType]);
  return S.equipment.filter(e=>{
    if(project&&!pdsSameValue(e.project,project))return false;
    if(sec&&!pdsSameValue(e.plantSection,sec))return false;
    if(stype&&!pdsSameValue(e.plantSectionType,stype))return false;
    if(tag&&!pdsSameValue(e.tag,tag))return false;
    if(group&&!pdsSameValue(e.groupCode,group))return false;
    if(dept&&!pdsSameValue(e.department,dept))return false;
    if(cat&&!pdsSameValue(e.equipmentCategory,cat))return false;
    if(etype&&!pdsSameValue(e.equipmentType,etype))return false;

}
function pdsRowMatchesAssignment(row,a){
  if(!a)return true;
  const expected=[
    [scalar(a[AF.projectCode]),PDS_SCOPE_ALIASES.project,"project"],
    [scalar(a[AF.plantSection]),PDS_SCOPE_ALIASES.plantSection,"scope"],
    [scalar(a[AF.plantSectionType]),PDS_SCOPE_ALIASES.plantSectionType,"scope"],
    [scalar(a[AF.tagNo]),PDS_SCOPE_ALIASES.tag,"scope"],
    [scalar(a[AF.groupCode]),PDS_SCOPE_ALIASES.groupCode,"scope"],
    [scalar(a[AF.department]),PDS_SCOPE_ALIASES.department,"scope"],
    [scalar(a[AF.equipmentCategory]),PDS_SCOPE_ALIASES.category,"scope"],
    [scalar(a[AF.equipmentType]),PDS_SCOPE_ALIASES.equipmentType,"scope"]
  ];
  let comparedScope=false;
  for(const [wanted,aliases,kind] of expected){
    if(!wanted)continue;
    const actual=pick(row,aliases,"");
    if(actual){if(!pdsSameValue(actual,wanted))return false;if(kind==="scope")comparedScope=true;}
  }
  // Some detail reports do not repeat Plant Section/Type fields. When that
  // happens, fall back to Tag / Equipment Name and the already-loaded Master
  // Equipment List so the current responsibility still narrows the PDS data.
  const hasDetailedScope=expected.slice(1).some(([v])=>Boolean(v));
  if(hasDetailedScope&&!comparedScope){
    const allowed=assignmentScopedEquipment(a);
    if(allowed.length){
      const tag=pick(row,PDS_SCOPE_ALIASES.tag,""),name=pick(row,PDS_SCOPE_ALIASES.equipmentName,"");
      if(tag&& !allowed.some(e=>pdsSameValue(e.tag,tag)))return false;
      if(!tag&&name&& !allowed.some(e=>pdsSameValue(e.name,name)))return false;
    }
  }
  return true;
}
async function resolvePdsSource(type){
  if(Object.prototype.hasOwnProperty.call(S.pds.resolved,type))return S.pds.resolved[type];
  const candidates=PDS_REPORTS[type]||[];
  const errors=[];
  for(const report of candidates){
    try{
      const rows=await fetchRecords(report,"",20);
      S.pds.resolved[type]=report;S.pds.probe[type]=rows;
      log("pds-report-resolved",{type,report,rows:rows.length});
      return report;
    }catch(e){errors.push(`${report}: ${errorText(e)}`)}
  }
  S.pds.resolved[type]=null;
  S.pds.errors[type]=errors.join(" | ")||"No report candidate configured.";
  return null;
}
async function ensurePdsData(type="all",force=false){
  const dataKey=type==="all"?"summary":"detail";
  if(type==="all"&&!force&&Array.isArray(S.pds.summary))return;
  if(type!=="all"&&!force&&Array.isArray(S.pds.detail[type]))return;
  if(S.pds.loading[type])return;
  S.pds.loading[type]=true;
  try{
    if(force){delete S.pds.resolved[type];delete S.pds.errors[type]}
    const report=await resolvePdsSource(type);
    if(!report){
      if(type==="all")S.pds.summary=[];else S.pds.detail[type]=[];
      return;
    }
    const rows=Array.isArray(S.pds.probe[type])?S.pds.probe[type]:await fetchRecords(report,"",20);delete S.pds.probe[type];
    if(type==="all")S.pds.summary=rows;else S.pds.detail[type]=rows;
  }finally{
    S.pds.loading[type]=false;
  }
}
function pdsRowsForType(type){return type==="all"?(S.pds.summary||[]):(S.pds.detail[type]||[])}
function pdsRowsInScope(type){return pdsRowsForType(type).filter(r=>pdsRowMatchesAssignment(r,S.current))}
function pdsSearchMatch(row,q){
  if(!q)return true;

  const values=fields.map(k=>scalar(row?.[k])).filter(Boolean).join(" ").toLowerCase();

function pdsRowPassesStatus(row,type,status){
  if(!status||status==="All")return true;
  if(type==="all")return Object.keys(PDS_STATUS_ALIASES).some(k=>nk(pdsStatusValue(row,k))===nk(status));

}

/* ================= V17.12: LEVEL-0 PDS DASHBOARD COUNTS =================
   IMPORTANT BUSINESS RULE:
   - The Level-0 / Primary PDS assignment is the management dashboard.
   - Count ONLY the PDS discipline that the All_PD_Sheet source row actually
     belongs to, using PDS_Related_To.
   - Example: if a CL-1401 row says PDS Related To = Nozzle PDS, that row is
     counted ONLY in Nozzle PDS. Its Structure/Piping "Pending" columns do NOT
     increase Structure/Piping dashboard counts.
   - Therefore, if the project contains 10 actual Structure PDS source rows,
     the Structure PDS card shows 10. If there is no Consumable PDS source row,
     the Consumable PDS card is hidden.
   - "Total PDS" is the total number of actual PDS work items across all
     disciplines (Equipment + Nozzle + Structure + Piping + Bought Out +
     Consumable + E&I) within the current Level-0 responsibility.
   ======================================================================= */
function pdsActualRowsForType(type){
  const rows=pdsRowsInScope("all");
  const hasRelated=rows.some(r=>Boolean(pdsRelatedTypeKey(r)));

  // Preferred / current data model: PDS_Related_To tells us the real PDS type.
  if(hasRelated){
    return rows.filter(r=>pdsRelatedTypeKey(r)===type);
  }

  // Legacy compatibility only: if old All_PD_Sheet data has no PDS_Related_To
  // at all, fall back to the populated discipline status column.
  return rows.filter(r=>Boolean(pdsStatusValue(r,type)));
}
function pdsSummaryStats(type){
  if(type==="all"){
    const rows=pdsRowsInScope("all");
    const hasRelated=rows.some(r=>Boolean(pdsRelatedTypeKey(r)));
    if(hasRelated){
      const actual=rows.filter(r=>Boolean(pdsRelatedTypeKey(r)));
      return {total:actual.length,pending:0,under:0,approved:0};
    }
    return {total:rows.length,pending:0,under:0,approved:0};
  }

  const rows=pdsActualRowsForType(type);
  const statuses=rows.map(r=>pdsStatusValue(r,type)).filter(Boolean);
  return {
    total:rows.length,
    pending:statuses.filter(s=>nk(s).includes("pending")&&!nk(s).includes("under")).length,
    under:statuses.filter(s=>nk(s).includes("underapproval")).length,
    approved:statuses.filter(s=>nk(s).includes("approved")&&!nk(s).includes("under")).length
  };
}
function isLevelZeroPdsDashboard(){

}
/* ================= V17.9: PDS BULK ASSIGNMENT ENGINE =================
   Business rule:
   - One Tag / Equipment is shown only once.
   - Under that Tag, Equipment / Nozzle / Structure / Piping / Bought Out /
     Consumable / E&I PDS are separate work items.
   - Each selected PDS work item creates ONE independent Design_Tracking
     assignment record. No PDS source record is copied or modified.
   - Existing assignment identity uses Project + Drawing(PDS) + Tag/Work Item
     + PDS Type. PDS Type is stored in the existing Design_Type field so no
     new Creator field or form is required.
   ===================================================================== */
function pdsAssignableTypes(){return PDS_TYPES.filter(t=>t.key!=="all")}
function pdsTypeLabel(type){return pdsTypeConfig(type).label}
function pdsScopeValue(row,key){return pick(row,PDS_SCOPE_ALIASES[key]||[],"")}
function pdsWorkIdentity(row){
  const tag=pdsScopeValue(row,"tag"),name=pdsScopeValue(row,"equipmentName"),ref=pdsScopeValue(row,"sectionRef");
  // Some PDS reports (Consumable / E&I) may not use an equipment tag. Keep a
  // stable readable fallback so those rows can still participate in bulk assignment.
  const fallback=pick(row,["Item_Name","Material_Name","Instrument_Tag","PDS_Name","Name"],"");
  return {tag,name:name||fallback,ref,key:nk(tag||ref||name||fallback||idOf(row))};
}
function pdsAssignmentGroupKey(row){
  const i=pdsWorkIdentity(row),project=pdsScopeValue(row,"project")||scalar(S.current?.[AF.projectCode]);
  return `${nk(project)}::${i.key}`;
}
function addPdsSourceRowToGroup(map,row,type){
  if(!row||!pdsRowMatchesAssignment(row,S.current))return;
  const key=pdsAssignmentGroupKey(row),ident=pdsWorkIdentity(row);
  if(!map.has(key)){
    map.set(key,{key,project:pdsScopeValue(row,"project")||scalar(S.current?.[AF.projectCode]),plantSection:pdsScopeValue(row,"plantSection"),plantSectionType:pdsScopeValue(row,"plantSectionType"),tag:ident.tag,name:ident.name,sectionRef:ident.ref,groupCode:pdsScopeValue(row,"groupCode"),department:pdsScopeValue(row,"department"),equipmentCategory:pdsScopeValue(row,"category"),equipmentType:pdsScopeValue(row,"equipmentType"),raw:[],types:{}});
  }
  const g=map.get(key);g.raw.push(row);

  // Fill blank Tag context from later source rows belonging to the same Tag.
  for(const k of ["plantSection","plantSectionType","tag","name","sectionRef","groupCode","department","equipmentCategory","equipmentType"]){
    if(!g[k]){
      const src={plantSection:"plantSection",plantSectionType:"plantSectionType",tag:"tag",name:"equipmentName",sectionRef:"sectionRef",groupCode:"groupCode",department:"department",equipmentCategory:"category",equipmentType:"equipmentType"}[k];
      g[k]=src?pdsScopeValue(row,src):g[k];
    }
  }

  // -------------------------------------------------------------------
  // V17.12 IMPORTANT PDS RULE
  // -------------------------------------------------------------------
  // All_PD_Sheet can contain multiple physical rows for the SAME Tag.
  // Example CL-1401:
  //   Row A -> PDS Related To = Equipment PDS
  //   Row B -> PDS Related To = Nozzle PDS
  // Those are TWO independent assignable responsibilities beneath ONE Tag.
  //
  // We therefore use PDS_Related_To first. We DO NOT create Structure/Piping
  // assignment units merely because their status columns say "Pending" on an
  // Equipment-PDS row. A PDS type becomes assignable when a real source row
  // exists for that PDS Related To value (or a detailed PDS report is loaded).
  // -------------------------------------------------------------------
  if(type==="all"){
    const related=pdsRelatedTypeKey(row);
    if(related){
      const status=pdsStatusValue(row,related);
      if(!g.types[related])g.types[related]={statuses:[],rows:[]};
      if(status)g.types[related].statuses.push(status);
      g.types[related].rows.push(row);
      return;
    }

    // Backward-compatible fallback for older All_PD_Sheet rows that do not
    // contain PDS_Related_To. In those legacy rows, use populated status fields.
    for(const t of pdsAssignableTypes()){
      const status=pdsStatusValue(row,t.key);
      if(status){
        if(!g.types[t.key])g.types[t.key]={statuses:[],rows:[]};
        g.types[t.key].statuses.push(status);
        g.types[t.key].rows.push(row);
      }
    }
    return;
  }

  // Detailed reports already identify their discipline by the report opened.
  const status=pdsStatusValue(row,type);
  if(!g.types[type])g.types[type]={statuses:[],rows:[]};
  if(status)g.types[type].statuses.push(status);
  g.types[type].rows.push(row);
}
function pdsAssignmentGroups(){
  const map=new Map();
  // All_PD_Sheet is the primary source because it contains multiple PDS status columns.
  for(const r of (S.pds.summary||[]))addPdsSourceRowToGroup(map,r,"all");
  // Merge any detailed PDS reports already loaded. This also supports PDS types that
  // are not represented as a status column in All_PD_Sheet.
  for(const t of pdsAssignableTypes())for(const r of (S.pds.detail[t.key]||[]))addPdsSourceRowToGroup(map,r,t.key);
  return [...map.values()].sort((a,b)=>`${a.tag} ${a.name}`.localeCompare(`${b.tag} ${b.name}`,undefined,{numeric:true}));
}

function pdsStatusSummaryHtml(statuses=[]){const rows=pdsStatusCounts(statuses);return rows.length?`<div class="pds-mini-status">${rows.map(x=>`${pdsStatusPill(x.label)}${x.count>1?`<span class="pill">×${x.count}</span>`:""}`).join("")}</div>`:'<span class="tiny muted">No source status</span>'}

      S.user=init?.loginUser||"";
      S.app=init?.appLinkName||CONFIG.APP_NAME;
    }

    // IMPORTANT: the old working widget loaded master reports independently.
    // Do that first so an empty/blocked tracking report can never blank the
    // Project and Drawing dropdowns.
    const [pr,dr,er,psr]=await Promise.all([
      safeSource(CONFIG.REPORTS.projects,"Project master"),
      safeSource(CONFIG.REPORTS.drawings,"Drawing master"),
      safeSource(CONFIG.REPORTS.employees,"Employee master"),
      safeSource(CONFIG.REPORTS.plantSections,"Plant Section master")
    ]);

    S.projects=pr.map(adaptProject).filter(x=>x.code)
      .sort((a,b)=>String(b.code).localeCompare(String(a.code),undefined,{numeric:true}));
    S.drawings=dr.map(adaptDrawing).filter(x=>x.name)
      .sort((a,b)=>a.name.localeCompare(b.name));
    S.employees=er.map(adaptEmployee).filter(x=>x.email||x.name)
      .sort((a,b)=>a.name.localeCompare(b.name));
    // V18.2: restore the old working Plant Section Type -> Plant Section map.
    // In the legacy Equipment report Plant Section can be a grouped field and
    // may be missing from each row, while Plant Section Type is still present.
    S.plantSections=psr.map(adaptPlantSectionMaster).filter(x=>x.section||x.type);
    S.plantSectionTypeMap=new Map();
    S.plantSections.forEach(x=>{if(x.type&&x.section)S.plantSectionTypeMap.set(nk(x.type),x.section);});
    // Equipment is loaded lazily per Project and cached.
    S.equipment=[];

    // Tracking is secondary. An empty Design_Tracking_Report is valid and a
    // permission/read problem is shown as a warning without disabling masters.
    let tr=[];
    try{
      const trackingSource=await resolveTrackingSource();
      tr=trackingSource.rows||[];
      log("tracking-report-in-use",{report:CONFIG.REPORTS.tracking,records:tr.length});
    }catch(trackError){
      console.error("Design Tracking read failed",trackError);
      toast(`Design Tracking could not be read: ${errorText(trackError)}`,"warn");
      log("tracking-read-warning",{error:errorText(trackError)});
    }

    S.records=tr.map(adaptRecord);
    S.assignments=S.records.filter(isAssignmentRecord);
    S.revisions=S.records.filter(isRevisionRecord);

    try{await loadTrackingFieldMetadata();}catch(_){ }
    $("sessionPill").textContent=S.user?`Signed in: ${personDisplay(S.user)||S.user}`:"Creator session connected";
    renderView();
    startSystemAlertRefresh();

    const missing=[];
    if(!S.projects.length)missing.push(CONFIG.REPORTS.projects);
    if(!S.drawings.length)missing.push(CONFIG.REPORTS.drawings);
    if(!S.employees.length)missing.push(CONFIG.REPORTS.employees);

    if(missing.length)toast(`No rows could be read from: ${missing.join(", ")}. Check report permission only for those reports.`,"warn");
  }catch(e){
    console.error(e);
    const detail=errorText(e);
    $("sessionPill").textContent="Creator session error";
    $("page").innerHTML=`<div class="panel"><div class="panel-body"><div class="empty"><div class="ico">⚠</div><strong>Creator masters could not be loaded</strong><div>${h(detail)}</div><div class="small" style="margin-top:8px">Expected old report links: All_Associated_Projects, All_Drawing_Types, Employ_to_Create_ticket_Report and Master_Equipment_List_Subform_Report.</div></div></div></div>`;
    toast(detail,"error");
  }finally{
    idle();
  }
}

/* V17.18: silent tracking refresh so the notification bell updates even when
   the recipient keeps the widget open. No full-screen loading overlay is used. */
async function silentAlertRefresh(){
  if(S.demo)return;
  try{
    const source=await resolveTrackingSource(),tr=source.rows||[];
    S.records=tr.map(adaptRecord);
    S.assignments=S.records.filter(isAssignmentRecord);
    S.revisions=S.records.filter(isRevisionRecord);
    updateNotificationBell();
    if(S.view==="search"&&S.globalSearch)renderUniversalSearch();

}

  S.cache.alertTimer=setInterval(()=>silentAlertRefresh(),Math.max(30000,Number(CONFIG.ALERT_REFRESH_MS)||60000));
  window.addEventListener("focus",()=>silentAlertRefresh());
}

// workflowActions(): returns ONLY the next normal workflow action for the current revision.
//
// V17.7 POC BEHAVIOUR:
// - The UI is STEP-BY-STEP. It does NOT display every possible status button together.
// - Logged-in-user role validation is STILL DISABLED for the POC.
// - Therefore ANY Creator user who can access/update this record may perform the visible step.
// - Checker / Reviewer / Approver fields are informational during this POC and do not block action.
// - The old backend sequence-validation block inside moveWorkflow() remains commented.
//   So this is a USER-INTERFACE sequence, not a security restriction.
function workflowActions(r,a){
  const s=scalar(r[AF.status])||"Not Started";

  // Main happy-path sequence. Exactly one main button is displayed at a time.
  const next={
    "Not Started":["Start Design","In Progress","primary"],
    "In Progress":["Submit for Check","Submitted for Check","primary"],
    "Submitted for Check":["Begin Checking","Checking","primary"],
    "Checking":["Mark Checked","Checked","success"],
    "Checked":["Submit for Review","Submitted for Review","primary"],
    "Submitted for Review":["Begin Review","Reviewing","primary"],
    "Reviewing":["Mark Reviewed","Reviewed","success"],
    "Reviewed":["Submit for Approval","Submitted for Approval","primary"],
    "Submitted for Approval":["Begin Approval","Approving","primary"],
    "Approving":["Approve","Approved","success"],
    "Approved":["Issue Drawing","Issued","primary"],
    "Issued":["Complete","Completed","success"],
    "Returned":["Resume Work","In Progress","primary"],
    "On Hold":["Resume Work","In Progress","primary"]
  };

  const x=next[s];
  return x?[x]:[];
}

// workflowMoreActions(): keeps exception functionality available without cluttering the main UI.
// These are intentionally placed under "More actions" so the normal user sees only one next step.
// No logged-in-user role validation is applied in this POC.
function workflowMoreActions(r,a){
  const s=scalar(r[AF.status])||"Not Started";
  const actions=[];

  // Allow a working design to be put on hold without mixing it into the main next-step button.
  if(["In Progress","Submitted for Check","Checking","Checked","Submitted for Review","Reviewing","Reviewed","Submitted for Approval","Approving"].includes(s)){
    actions.push(["Put On Hold","On Hold",""]);
  }

  // Preserve Return functionality during checking/review/approval stages.
  // Return Reason remains optional because its production validation is commented for the POC.
  if(["Checking","Reviewing","Approving"].includes(s)){
    actions.push(["Return to Designer","Returned","danger"]);
  }

  // Preserve Cancel functionality, but do not expose it as the main workflow action.
  if(!["Completed","Cancelled","Issued"].includes(s)){
    actions.push(["Cancel Design","Cancelled","danger"]);
  }

  return actions;
}

// workflowStageInfo(): converts detailed Creator statuses into a compact six-stage visual tracker.
function workflowStageInfo(status){
  const stages=["Design","Check","Review","Approval","Issue","Complete"];
  const indexMap={
    "Not Started":0,"In Progress":0,"Returned":0,"On Hold":0,
    "Submitted for Check":1,"Checking":1,"Checked":1,
    "Submitted for Review":2,"Reviewing":2,"Reviewed":2,
    "Submitted for Approval":3,"Approving":3,"Approved":3,
    "Issued":4,
    "Completed":5,
    "Cancelled":0
  };
  return {stages,index:indexMap[status]??0};
}

// renderWorkflow(): one clear next action at a time + compact progress track + optional exception actions.
function renderWorkflow(r,a){
  const status=scalar(r[AF.status])||"Not Started";
  const acts=workflowActions(r,a);
  const more=workflowMoreActions(r,a);
  const info=workflowStageInfo(status);
  const track=info.stages.map((name,i)=>{
    const cls=i<info.index?"done":(i===info.index?"active":"");
    return `<div class="wf-step ${cls}">${h(name)}</div>`;
  }).join("");

  const next=acts[0];
  const nextHtml=next
    ? `<div class="workflow-next"><div class="copy"><strong>Next step: ${h(next[0])}</strong><span>POC open access: any permitted Creator user can perform this step.</span></div><button class="btn ${h(next[2]||"primary")}" data-workflow-to="${h(next[1])}">${h(next[0])}</button></div>`
    : `<div class="workflow-next"><div class="copy"><strong>${status==="Completed"?"Workflow completed":"No normal next step"}</strong><span>Current status: ${h(status)}</span></div></div>`;

  const moreHtml=more.length
    ? `<details class="workflow-more"><summary>More actions</summary><div class="workflow-actions">${more.map(([label,to,style])=>`<button class="btn ${h(style||"")}" data-workflow-to="${h(to)}">${h(label)}</button>`).join("")}</div></details>`
    : "";

  return `<div class="workflow"><div class="workflow-card"><div class="workflow-top"><div><h4 style="margin:0">Design workflow</h4><div class="small muted" style="margin-top:2px">Only the current next step is shown. No owner/checker/reviewer/approver identity validation is enforced in this POC.</div></div>${statusPill(status)}</div><div class="wf-track">${track}</div>${nextHtml}${moreHtml}</div></div>`;
}

function renderRevisionTab(){const a=S.current,rows=revisionsForAssignment(a).slice().reverse(),cur=currentRevision(a);return `<div class="tab-card"><div class="section-row" style="margin-top:0"><div><h2>Revision History</h2><p>Every revision is a separate Design_Tracking record. Older revisions remain read-only.</p></div>${cur&&["Approved","Issued","Completed"].includes(scalar(cur[AF.status]))?'<button class="btn soft" data-act="new-revision">＋ New Revision</button>':""}</div>${rows.length?`<div class="timeline">${rows.map(r=>renderRevisionCard(r,cur)).join("")}</div>`:`<div class="empty"><div class="ico">R0</div><strong>No revision history yet</strong>Start R0 from Design Files.</div>`}</div>`}
function renderRevisionCard(r,cur){

// equipmentWithinAssignment(): scope inheritance guard; child targets must stay inside Project/Section/Type/Tag/etc. already received.
function equipmentWithinAssignment(eq,a){
  /* ORIGINAL PRODUCTION SCOPE-INHERITANCE VALIDATION — COMMENTED FOR POC:

  if(String(eq.project||"")!==scalar(a[AF.projectCode])) return false;

  const checks=[
    [AF.plantSection,"plantSection"],
    [AF.plantSectionType,"plantSectionType"],
    [AF.groupCode,"groupCode"],
    [AF.department,"department"],
    [AF.equipmentCategory,"equipmentCategory"],
    [AF.equipmentType,"equipmentType"],
    [AF.tagNo,"tag"]
  ];

  for(const [field,equipmentKey] of checks){
    const receivedValue=scalar(a[field]);
    if(receivedValue && String(eq[equipmentKey]||"")!==receivedValue){
      return false;
    }
  }

  return true;
  */

  // POC OPEN-SCOPE RULE:
  // Received Section / Section Type / Group / Department / Category / Type / Tag
  // are NOT used to restrict the next assignment. Users can choose another value
  // anywhere inside the same Project while testing the delegation model.
  // Project + Drawing are intentionally kept as the identity of the family tree.
  return String(eq.project||"")===scalar(a[AF.projectCode]);
}

function buildChildPayload(parent,row,draft){const recipient=requireAssignmentRecipient(draft.user);draft={...draft,user:recipient.email};const d=drawingForAssignment(parent),criteriaLabels=[...S.selectedCriteria].map(k=>CRITERIA.find(c=>c.key===k).label),data={

// uploadRevisionFiles(): each selected file is uploaded in a separate Creator
// FILE.uploadFile call. On a Multiple Upload field this appends new files while
// preserving files uploaded on previous days. The record is refreshed afterwards
// to retain Creator's real filename + filepath metadata for downloads.
async function uploadRevisionFiles(id,fileGroups,record){
  let uploaded=0;
  for(const [field,fileList] of fileGroups){
    const files=Array.from(fileList||[]);
    for(let i=0;i<files.length;i++){
      const file=files[i];
      if(!file)continue;
      $("loadingText").textContent=`Uploading ${file.name} (${i+1}/${files.length})…`;
      await uploadFile(id,field,file);uploaded++;
    }
  }
  if(uploaded){
    const fresh=await getTrackingRecordById(id);
    if(fresh){
      Object.assign(record,fresh);
      const local=S.records.find(x=>idOf(x)===String(id));if(local&&local!==record)Object.assign(local,fresh);
      const rev=S.revisions.find(x=>idOf(x)===String(id));if(rev&&rev!==record)Object.assign(rev,fresh);
    }
  }
  return uploaded;
}

// creatorFileResponseToBlob(): normalizes the different binary response shapes
// returned by Creator FILE.readFile across browsers / SDK builds.
// IMPORTANT: Typed arrays are objects in JavaScript, so they MUST be handled
// before the generic object-wrapper branch. V17.15 checked generic objects first,
// which is why a valid Uint8Array response was rejected as "unexpected object".
async function creatorFileResponseToBlob(value,fileName,depth=0){
  if(depth>8)throw new Error("Creator file response nesting is too deep.");
  if(value===null||value===undefined)throw new Error("Creator returned an empty file response.");

  const mime=mimeTypeForFile(fileName);

  // Native browser Blob.
  if(value instanceof Blob)return value;

  // Raw ArrayBuffer.
  if(value instanceof ArrayBuffer)return new Blob([value],{type:mime});

  // Uint8Array / Int8Array / DataView / other typed-array views.
  // Slice only the active byte range; using the entire backing buffer can add
  // unwanted bytes when byteOffset / byteLength do not cover the whole buffer.
  if(ArrayBuffer.isView(value)){
    const bytes=new Uint8Array(value.buffer,value.byteOffset,value.byteLength);
    return new Blob([bytes],{type:mime});
  }

  // Some SDK/browser combinations may expose a Fetch Response-like object.
  if(typeof Response!=="undefined"&&value instanceof Response){
    return await value.blob();
  }

  // Creator documentation describes readFile response as "filecontent".
  // In practice this can be a raw binary string.
  if(typeof value==="string"){
    if(value.startsWith("data:"))return await (await fetch(value)).blob();
    return binaryStringToBlob(value,mime);
  }

  // Numeric byte array.
  if(Array.isArray(value)){
    if(value.every(x=>Number.isInteger(Number(x))&&Number(x)>=0&&Number(x)<=255)){
      return new Blob([new Uint8Array(value.map(Number))],{type:mime});
    }
    if(value.length===1)return await creatorFileResponseToBlob(value[0],fileName,depth+1);
  }

  if(typeof value==="object"){
    // If Creator returned an API ERROR object, surface the real error instead
    // of calling it an unsupported [object Object] file response.
    if(value.code!=null&&Number(value.code)!==3000){
      throw new Error(value.message||value.description||`Creator file API failed with code ${value.code}.`);
    }

    // Node/SDK Buffer JSON shape: { type:"Buffer", data:[...] }
    if(value.type==="Buffer"&&Array.isArray(value.data)){
      return new Blob([new Uint8Array(value.data)],{type:mime});
    }

    // Axios / SDK / Creator wrapper variants. Recursively unwrap instead of
    // assuming response.data is already a string.
    const wrapperKeys=[
      "data","filecontent","file_content","value","result","response",
      "body","content","file","blob","payload"
    ];
    for(const key of wrapperKeys){
      if(Object.prototype.hasOwnProperty.call(value,key)&&value[key]!==value&&value[key]!=null){
        try{return await creatorFileResponseToBlob(value[key],fileName,depth+1)}catch(_){ }
      }
    }

    // XMLHttpRequest-like response.
    if(value.response!==undefined&&value.response!==value){
      return await creatorFileResponseToBlob(value.response,fileName,depth+1);
    }
    if(typeof value.responseText==="string"&&value.responseText){
      return binaryStringToBlob(value.responseText,mime);
    }

    // A few SDK builds expose byte content as an object with numeric keys:
    // {0:37,1:80,2:68,3:70,...}
    const keys=Object.keys(value);
    if(keys.length&&keys.every(k=>/^\d+$/.test(k))){
      const ordered=keys.sort((a,b)=>Number(a)-Number(b)).map(k=>Number(value[k]));
      if(ordered.every(x=>Number.isInteger(x)&&x>=0&&x<=255)){
        return new Blob([new Uint8Array(ordered)],{type:mime});
      }
    }

    console.error("Unrecognized Creator readFile response",value);
    throw new Error(
      `Creator returned an unsupported file response (${Object.prototype.toString.call(value)}). `+
      `Open browser console and check "Unrecognized Creator readFile response" if this continues.`
    );
  }

  throw new Error(`Unsupported Creator file response type: ${typeof value}.`);
}

// downloadRevisionFile(): downloads ONE real stored file using its exact
// Creator file_path and original display filename. This preserves the original
// PDF/DWG/DXF/XLSX/ZIP/etc. file instead of writing [object Object].
async function downloadRevisionFile(id,field,filePath,fileName){
  const name=safeFileName(fileName,"download");
  busy(`Downloading ${name}…`);
  try{
    const response=await readFile(id,field,filePath);
    const blob=await creatorFileResponseToBlob(response,name);

    if(!blob||!blob.size){
      throw new Error("Creator returned an empty file.");
    }

    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;
    a.download=name;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
  }finally{idle()}
}

function v18ProjectAssignments(code){return S.assignments.filter(a=>scalar(a[AF.projectCode])===String(code||""));}
function v18ProjectRevisions(code){return S.revisions.filter(r=>scalar(r[AF.projectCode])===String(code||""));}
function v18OpenAssignments(rows){return rows.filter(a=>!isClosedAssignment(a));}
function v18ProjectRoots(code){return v18ProjectAssignments(code).filter(a=>num(a[AF.assignmentLevel])===0);}
function v18ProjectCurrentRevisions(code){return v18ProjectAssignments(code).map(a=>currentRevision(a)).filter(Boolean);}
function v18ProjectStats(code){
  const rows=v18ProjectAssignments(code), open=v18OpenAssignments(rows), roots=rows.filter(a=>num(a[AF.assignmentLevel])===0), completed=rows.filter(a=>scalar(a[AF.status])==="Completed");
  const logical=rows.filter(a=>num(a[AF.assignmentLevel])>0 || !assignmentChildren(idOf(a)).length);
  const base=logical.length?logical:rows;
  const avg=base.length?Math.round(base.reduce((s,a)=>s+num(a[AF.progress]),0)/base.length):0;
  const overdue=open.filter(a=>{const d=dateDiffDays(toInputDate(a[AF.targetDate]));return d!=null&&d<0;}).length;
  const owners=[...new Set(roots.map(assignmentDisplayUser).filter(Boolean))];
  return {rows,open,roots,completed,avg,overdue,owners,total:base.length};
}
function v18ProjectForCode(code){return S.projects.find(p=>String(p.code)===String(code))||{code:String(code),name:""};}
function v18ProjectCodes(){return [...new Set([...S.projects.map(p=>p.code).filter(Boolean),...S.assignments.map(a=>scalar(a[AF.projectCode])).filter(Boolean)])].sort((a,b)=>String(b).localeCompare(String(a),undefined,{numeric:true}));}
function v18ProjectStatus(st){if(!st.rows.length)return '<span class="pill">No Design Work</span>';if(st.open.length)return '<span class="pill green">Active</span>';return '<span class="pill blue">Completed</span>';}

function renderProjects(){
  const q=S.globalSearch.trim().toLowerCase();
  const codes=v18ProjectCodes().filter(code=>{const p=v18ProjectForCode(code),st=v18ProjectStats(code),hay=[code,p.name,...st.owners].join(" ").toLowerCase();return !q||hay.includes(q)});

}

  S.projectWorkspace.assignDraft=d;return d;
}
function v182SectionUnits(){

    const u=map.get(k);if(x.plantSectionType)u.types.add(String(x.plantSectionType).trim());if(x.tag)u.tags.add(String(x.tag).trim());
  }
  return [...map.values()].map(u=>({...u,types:[...u.types].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})),tagCount:u.tags.size})).sort((a,b)=>a.section.localeCompare(b.section,undefined,{numeric:true}));
}
function v182TypeUnits(){
  const map=new Map();

    const section=String(x.plantSection||'').trim(),type=String(x.plantSectionType||'').trim();if(!section||!type)continue;const key=`${section}|||${type}`;
    if(!map.has(key))map.set(key,{key,section,type,tags:new Set()});if(x.tag)map.get(key).tags.add(String(x.tag).trim());
  }
  return [...map.values()].map(u=>({...u,tagCount:u.tags.size})).sort((a,b)=>(a.section+' '+a.type).localeCompare(b.section+' '+b.type,undefined,{numeric:true}));
}
function v182TagUnits(){

/* ======================================================================
   V20 FINAL PROJECT DESIGN MODEL
   ----------------------------------------------------------------------
   USER FLOW:
     Projects -> Open Project -> Assign Design -> Select Drawing.
     Drawing_Type automatically decides the responsibility scope:
       Project / Plant Section / Plant Section Type / Tag.
     User selects one/many applicable targets, then assigns to one employee.

   IMPORTANT:
   - No legacy "Assign Further" or user-facing assignment hierarchy is used.
   - Every selected responsibility is a direct Level-0 Design_Tracking work item.
   - Technical IDs may still be stored in hidden backend link fields where
     needed for reliable joins, but the UI/report surfaces show readable names.
   ====================================================================== */

function v19OpaqueId(v){const s=String(v??'').trim();return /^\d{12,}$/.test(s)||/^[0-9a-f]{24,}$/i.test(s)||/^[0-9a-f-]{32,}$/i.test(s)}
function v19HumanizeEmail(v){const s=String(v||'').trim();if(!s.includes('@'))return s;return s.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function personDisplay(value){
  if(value&&typeof value==='object'){
    for(const key of ['display_value','zc_display_value','Employee_Name','Name','name','full_name','Full_Name']){
      if(value[key]!=null){const x=String(value[key]).trim();if(x&&!v19OpaqueId(x))return x;}
    }
  }
  const raw=scalar(value).trim();if(!raw)return'';
  const emp=employeeRecordFor(raw);if(emp?.name)return emp.name;
  if(raw.includes('@'))return v19HumanizeEmail(raw);
  if(v19OpaqueId(raw))return 'Creator User';
  return raw;
}
function assignmentDisplayUser(a){return scalar(a?.[AF.assignedEmployeeName])||personDisplay(a?.[AF.assignedTo])||'Unassigned'}
function assignmentByDisplay(a){return personDisplay(a?.[AF.assignedBy])||'Design Control'}
function v19CurrentUserReadable(){return personDisplay(S.user)||(!v19OpaqueId(S.user)?String(S.user||'').trim():'')||'Design Control'}
function v19BackendUserValue(){return v19CurrentUserReadable()}

function v19DrawingScopeRaw(d){
  if(!d)return'';
  const extra=pick(d.raw||{},['Assignment_Scope','Drawing_Scope','Scope_Level','Scope','Applicability_Level','Applicability','Design_Scope'],'');
  return [d.type||'',extra||''].filter(Boolean).join(' | ');
}
function v19ScopeForDrawing(d){
  const k=nk(v19DrawingScopeRaw(d));
  if(!k)return'';
  // Tag must win over Section because values such as
  // "Project Code + Plant Section + Tag No" contain both words.
  if(k.includes('tagno')||k.includes('tagnumber')||k.includes('equipmenttag')||k.endsWith('tag')||k.includes('tagwise'))return'Tag Wise';
  if(k.includes('plantsectiontype')||k.includes('sectiontype')||k.includes('sectiontypewise'))return'Section Type Wise';
  if(k.includes('plantsection')||k.includes('sectionwise'))return'Section Wise';
  if(k.includes('projectcode')||k.includes('projectwise')||k==='project')return'Project Wise';
  return'';
}
function v19ScopeClass(mode){return mode==='Project Wise'?'project':mode==='Section Wise'?'section':mode==='Section Type Wise'?'sectiontype':mode==='Tag Wise'?'tag':''}
function v19ScopeLevel(mode){return mode==='Project Wise'?'Project Document':mode==='Section Wise'?'Plant Section Document':mode==='Section Type Wise'?'Plant Section Type Document':mode==='Tag Wise'?'Equipment Design':''}
function v19Criteria(mode){return mode==='Project Wise'?'Project':mode==='Section Wise'?'Plant Section':mode==='Section Type Wise'?'Plant Section Type':mode==='Tag Wise'?'Tag Number':''}
function v19ScopeLabel(mode){return mode==='Section Wise'?'Plant Sections':mode==='Section Type Wise'?'Plant Section Types':mode==='Tag Wise'?'Tags / Equipment':'Project'}
function v19ScopeIcon(mode){return mode==='Project Wise'?'PRJ':mode==='Section Wise'?'SEC':mode==='Section Type Wise'?'TYPE':mode==='Tag Wise'?'TAG':'?'}
function v19ScopeCopy(mode){
  if(mode==='Project Wise')return'This design applies once to the complete project.';
  if(mode==='Section Wise')return'Select one, many, or all Plant Sections from this project.';
  if(mode==='Section Type Wise')return'Select one, many, or all Plant Section Types from this project.';
  if(mode==='Tag Wise')return'Select one or many Tags / Equipment and assign all selected tags to the same person.';
  return'This drawing does not have a recognized scope in the Drawing Master.';
}

function v19EnsureDraft(){
  const d=S.projectWorkspace.assignDraft||{};
  d.drawingId=d.drawingId||'';d.user=d.user||'';d.priority=d.priority||'Medium';d.start=d.start||todayIso();d.target=d.target||'';d.end=d.end||'';d.remark=d.remark||'';
  d.selectedSections=Array.isArray(d.selectedSections)?d.selectedSections:[];
  d.selectedSectionTypes=Array.isArray(d.selectedSectionTypes)?d.selectedSectionTypes:[];
  d.selectedTags=Array.isArray(d.selectedTags)?d.selectedTags:[];
  const drawing=S.drawings.find(x=>String(x.id)===String(d.drawingId));
  d.mode=drawing?v19ScopeForDrawing(drawing):'';
  S.projectWorkspace.assignDraft=d;return d;
}
function v18CollectAssignDraft(){
  const d=S.projectWorkspace.assignDraft||{};
  for(const [id,key] of [['v18Drawing','drawingId'],['v18User','user'],['v18Priority','priority'],['v18Start','start'],['v18Target','target'],['v18End','end'],['v18Remark','remark']]){const el=$(id);if(el)d[key]=el.value;}
  const drawing=S.drawings.find(x=>String(x.id)===String(d.drawingId));d.mode=drawing?v19ScopeForDrawing(drawing):'';
  S.projectWorkspace.assignDraft=d;return d;
}
function v19SelectionField(mode){return mode==='Section Wise'?'selectedSections':mode==='Section Type Wise'?'selectedSectionTypes':mode==='Tag Wise'?'selectedTags':''}
function v19Units(mode){if(mode==='Section Wise')return v182SectionUnits();if(mode==='Section Type Wise')return v182TypeUnits();if(mode==='Tag Wise')return v182TagUnits();return[]}
function v19SelectedValues(d){const f=v19SelectionField(d.mode);return f&&Array.isArray(d[f])?d[f]:[]}
function v19SelectedUnits(d){const selected=new Set(v19SelectedValues(d));return v19Units(d.mode).filter(u=>selected.has(u.key))}
function v19ScopeUnitText(mode,u){

  if(mode==='Section Type Wise')return `${u.section} › ${u.type}`;
  if(mode==='Tag Wise')return `${u.tag||'No Tag'}${u.name?` — ${u.name}`:''}`;

}
function v19Responsibility(mode,u){

  if(mode==='Project Wise')return `${project} — Entire Project`;
  if(mode==='Section Wise')return `${project} › ${u.section}`;
  if(mode==='Section Type Wise')return `${project} › ${u.section} › ${u.type}`;
  if(mode==='Tag Wise')return `${project} › ${u.section||'—'} › ${u.type||'—'} › ${u.tag||'No Tag'}${u.name?` — ${u.name}`:''}`;

function v19ExistingWork(p,drawing,mode,u){
  return S.assignments.find(a=>{
    if(scalar(a[AF.projectCode])!==String(p.code||''))return false;
    if(!(scalar(a[AF.drawingMasterId])===String(drawing.id)||scalar(a[AF.drawingDocument])===drawing.name))return false;
    // V19 direct work items are roots; old delegated child records are ignored.
    if(scalar(a[AF.assignedFrom]))return false;
    if(mode==='Project Wise')return !scalar(a[AF.plantSection])&&!scalar(a[AF.plantSectionType])&&!scalar(a[AF.tagNo]);
    if(mode==='Section Wise')return v18ScopeEq(scalar(a[AF.plantSection]),u.section)&&!scalar(a[AF.plantSectionType])&&!scalar(a[AF.tagNo]);
    if(mode==='Section Type Wise')return v18ScopeEq(scalar(a[AF.plantSection]),u.section)&&v18ScopeEq(scalar(a[AF.plantSectionType]),u.type)&&!scalar(a[AF.tagNo]);
    if(mode==='Tag Wise'){
      if(u.eq?.id&&scalar(a[AF.equipmentRecordId]))return scalar(a[AF.equipmentRecordId])===String(u.eq.id);
      return v18ScopeEq(scalar(a[AF.tagNo]),u.tag)&&v18ScopeEq(scalar(a[AF.plantSection]),u.section)&&v18ScopeEq(scalar(a[AF.plantSectionType]),u.type);
    }
    return false;
  })||null;
}
function v19ReadablePayload(p,drawing,recipient,draft,u=null){
  const mode=draft.mode,scope=v19Responsibility(mode,u||{}),data={
    [AF.projectCode]:p.code,
    [AF.projectRecordId]:p.id||'',
    [AF.drawingDocument]:drawing.name,
    [AF.drawingMasterId]:drawing.id,
    [AF.shortName]:drawing.short||'',
    [AF.designType]:drawing.name,
    [AF.designTitle]:`${drawing.name} — ${scope}`,
    [AF.scopeLevel]:v19ScopeLevel(mode),
    [AF.assignmentLevel]:0,
    [AF.assignedFrom]:'',
    [AF.assignedBy]:v19BackendUserValue(),
    [AF.assignedTo]:recipient.backendValue,
    [AF.assignedEmployeeName]:recipient.name,
    [AF.criteria]:v19Criteria(mode),
    [AF.responsibility]:scope,
    [AF.startDate]:toCreatorDate(draft.start),
    [AF.targetDate]:toCreatorDate(draft.target),
    [AF.endDate]:toCreatorDate(draft.end),
    [AF.priority]:draft.priority||'Medium',
    [AF.status]:'Not Started',
    [AF.progress]:0,
    [AF.remark]:draft.remark||''
  };
  if(mode==='Section Wise'&&u){data[AF.plantSection]=u.section||'';}
  if(mode==='Section Type Wise'&&u){data[AF.plantSection]=u.section||'';data[AF.plantSectionType]=u.type||'';}
  if(mode==='Tag Wise'&&u){const eq=u.eq||{};data[AF.plantSection]=u.section||eq.plantSection||'';data[AF.plantSectionType]=u.type||eq.plantSectionType||'';data[AF.tagNo]=u.tag||eq.tag||'';data[AF.equipmentName]=u.name||eq.name||'';data[AF.equipmentRecordId]=eq.id||'';data[AF.groupCode]=eq.groupCode||'';data[AF.department]=eq.department||'';data[AF.equipmentCategory]=eq.equipmentCategory||'';data[AF.equipmentType]=eq.equipmentType||'';}
  data[AF.logicalTaskKey]=normalLogicalKeyFromAssignment(data);
  data[AF.activityLog]=initialActivity('Design Work Created',`${recipient.name} assigned ${drawing.name} — ${scope}.`,{kind:'assignment',assignedTo:recipient.email,assignedToName:recipient.name});
  return data;
}
async function createV18Assignment(){
  const draft=v18CollectAssignDraft(),p=v18ProjectForCode(S.projectWorkspace.code),drawing=S.drawings.find(x=>String(x.id)===String(draft.drawingId));
  if(!drawing)throw new Error('Select Drawing / Design.');
  if(!draft.mode)throw new Error(`Drawing Type for ${drawing.name} is not configured as Project / Plant Section / Plant Section Type / Tag.`);
  if(!draft.user)throw new Error('Select Assigned To.');
  if(!draft.start||!draft.target)throw new Error('Start Date and Target / Forecast Date are required.');
  if(draft.target<draft.start)throw new Error('Target / Forecast Date cannot be before Start Date.');
  if(draft.end&&draft.end<draft.start)throw new Error('Planned End Date cannot be before Start Date.');
  const recipient=requireAssignmentRecipient(draft.user);
  const units=draft.mode==='Project Wise'?[{key:'PROJECT'}]:v19SelectedUnits(draft);
  if(!units.length)throw new Error(`Select at least one ${v19ScopeLabel(draft.mode)}.`);
  if(units.length>CONFIG.MAX_BATCH)throw new Error(`Maximum ${CONFIG.MAX_BATCH} work items can be created in one batch.`);
  busy(`Creating ${units.length} design work item${units.length===1?'':'s'}…`);
  try{
    const created=[],failures=[];let skipped=0;
    for(const u of units){
      if(v19ExistingWork(p,drawing,draft.mode,u)){skipped++;continue;}
      try{
        const data=v19ReadablePayload(p,drawing,recipient,draft,draft.mode==='Project Wise'?null:u),id=await addRecord(data),rec={ID:id,...data};
        S.records.push(rec);S.assignments.push(rec);created.push(rec);
      }catch(err){failures.push({unit:u,error:err});console.error('V19 design work creation failed',u,err)}
    }
    if(created.length)await notifyCreatedAssignments(created);
    if(!created.length&&failures.length)throw new Error(`No work items were created. ${failures[0].error?.message||'Creator save failed.'}`);
    closeModal();const parts=[`${created.length} work item${created.length===1?'':'s'} created for ${recipient.name}`];if(skipped)parts.push(`${skipped} already existed`);if(failures.length)parts.push(`${failures.length} failed`);toast(parts.join(' • '),failures.length?'warn':'good');S.projectWorkspace.tab='designs';renderView();
  }finally{idle()}
}

function zcCriteriaText(v){return String(v??"").replace(/\\/g,"\\\\").replace(/"/g,'\\"')}

function dependencyStatus(r){return scalar(r[DF.status])||"Active"}
function dependencyReportCandidates(){return [...new Set([S.dependency.report,CONFIG.REPORTS.dependencies,...(CONFIG.DEPENDENCY_REPORT_CANDIDATES||[])].filter(Boolean))]}
async function resolveDependencyReport(){
  if(S.dependency.report)return S.dependency.report;
  let last=null;
  for(const report of dependencyReportCandidates()){
    try{await fetchRecords(report,"",1);S.dependency.report=report;CONFIG.REPORTS.dependencies=report;return report}catch(e){last=e}
  }
  S.dependency.error=last?errorText(last):"Dependency report was not found.";
  return "";
}
async function loadDependenciesForProject(code,force=false){
  code=String(code||"").trim();if(!code)return[];
  if(!force&&S.dependency.loadedProjects.has(code))return S.dependencies.filter(r=>scalar(r[DF.projectCode])===code);
  if(S.dependency.loadingProjects.has(code))return[];
  S.dependency.loadingProjects.add(code);
  try{
    const report=await resolveDependencyReport();
    if(!report)return[];
    const rows=await fetchRecords(report,`${DF.projectCode} == "${zcCriteriaText(code)}"`,20);
    S.dependencies=S.dependencies.filter(r=>scalar(r[DF.projectCode])!==code).concat(rows);
    S.dependency.loadedProjects.add(code);S.dependency.error="";
    return rows;
  }catch(e){S.dependency.error=errorText(e);console.warn("Dependency load failed",e);return[]}
  finally{S.dependency.loadingProjects.delete(code)}
}
async function addDependencyRecord(data){
  if(S.demo){const rec={ID:`DEP-DEMO-${Date.now()}`,...data};S.dependencies.push(rec);return idOf(rec)}
  const r=assertResp(await ZOHO.CREATOR.DATA.addRecords(withApp({form_name:CONFIG.FORMS.dependencies,payload:{data}})),"Create Design_Dependency");
  return String(r?.data?.ID||r?.data?.id||"")
}
async function deleteDependencyRecord(id){
  if(S.demo){S.dependencies=S.dependencies.filter(r=>idOf(r)!==String(id));return}
  const report=await resolveDependencyReport();if(!report)throw new Error("Design Dependency report is not configured.");
  if(!ZOHO?.CREATOR?.DATA?.deleteRecordById)throw new Error("Creator deleteRecordById is unavailable in this widget SDK session.");
  const raw=await ZOHO.CREATOR.DATA.deleteRecordById(withApp({report_name:report,id:String(id)}));
  if(raw&&raw.code!=null)assertResp(raw,"Delete Design_Dependency");
  S.dependencies=S.dependencies.filter(r=>idOf(r)!==String(id));
}
function dependencyRowsForAssignment(a){const id=idOf(a);return {predecessors:S.dependencies.filter(r=>scalar(r[DF.successorId])===id&&dependencyStatus(r)!=="Closed"),successors:S.dependencies.filter(r=>scalar(r[DF.predecessorId])===id&&dependencyStatus(r)!=="Closed")}}
function dependencyExists(pred,succ){return S.dependencies.some(r=>scalar(r[DF.predecessorId])===String(pred)&&scalar(r[DF.successorId])===String(succ)&&dependencyStatus(r)!=="Closed")}
function dependencyWouldCycle(pred,succ){
  pred=String(pred);succ=String(succ);if(pred===succ)return true;
  const graph=new Map();
  for(const r of S.dependencies){if(dependencyStatus(r)==="Closed")continue;const a=scalar(r[DF.predecessorId]),b=scalar(r[DF.successorId]);if(!a||!b)continue;if(!graph.has(a))graph.set(a,new Set());graph.get(a).add(b)}
  if(!graph.has(pred))graph.set(pred,new Set());graph.get(pred).add(succ);
  const stack=[succ],seen=new Set();
  while(stack.length){const n=stack.pop();if(n===pred)return true;if(seen.has(n))continue;seen.add(n);for(const x of graph.get(n)||[])stack.push(x)}
  return false;
}

  const otherId=scalar(r[kind==='pred'?DF.predecessorId:DF.successorId]),a=depWorkById(otherId),title=a?depWorkTitle(a):dependencyTitleFromRecord(r,kind),sub=a?depWorkSub(a):"Stored dependency",link=scalar(r[DF.linkType])||"Finish to Start (FS)",lag=num(r[DF.lagDays]),rel=scalar(r[DF.relationshipType])||"Reference";
  return `<div class="dep-v20-row"><div class="dep-v20-work">${a?`<button class="btn link" data-open-assignment="${h(otherId)}"><b>${h(title)}</b></button>`:`<b>${h(title)}</b>`}<span>${h(sub)}</span></div><div class="dep-rel"><span class="pill">${h(rel)}</span></div><div><span class="pill blue">${h(link.replace(/\s*\(.*/,''))}</span></div><div class="tiny muted">${lag?`${lag} day${Math.abs(lag)===1?'':'s'} lag`:'No lag'}</div><button class="btn sm danger" data-v20-delete-dep="${h(idOf(r))}" title="Remove dependency">Remove</button></div>`
}
function scheduleDependencyLoad(projectCode,context="detail"){
  if(!projectCode||S.dependency.loadedProjects.has(String(projectCode))||S.dependency.loadingProjects.has(String(projectCode)))return;
  setTimeout(()=>guarded(async()=>{await loadDependenciesForProject(projectCode);if(context==="project"&&S.view==="project"&&S.projectWorkspace.tab==="dependencies")renderProjectWorkspace();else if(context==="detail"&&S.view==="detail"&&S.detailTab==="dependency")renderDetailPage()}),0)
}
function renderAssignmentDependencyTabV18(){
  const a=S.current,code=scalar(a?.[AF.projectCode]);if(!a)return"";
  if(!S.dependency.loadedProjects.has(code)){scheduleDependencyLoad(code,"detail");return `<div class="tab-card"><div class="empty compact"><strong>Loading dependencies…</strong>Reading project predecessor / successor links.</div></div>`}
  if(!S.dependency.report&&S.dependency.error)return `<div class="tab-card">${dependencySetupHtml()}</div>`;
  const rows=dependencyRowsForAssignment(a);
  return `<div class="tab-card"><div class="section-row" style="margin-top:0"><div><h2>Dependencies</h2><p>Add any number of real engineering predecessors and successors. No assignment hierarchy is used.</p></div><div class="actions"><button class="btn" data-v20-add-dep="predecessor">＋ Add Predecessor</button><button class="btn primary" data-v20-add-dep="successor">＋ Add Successor</button></div></div><div class="dep-v20-grid"><div class="dep-v20-card"><div class="dep-v20-head"><h3>Predecessors</h3><span class="pill">${rows.predecessors.length}</span></div><div class="dep-v20-list">${rows.predecessors.length?rows.predecessors.map(r=>dependencyRowHtml(r,'pred')).join(''):`<div class="dep-v20-empty">No predecessor selected.</div>`}</div></div><div class="dep-v20-card"><div class="dep-v20-head"><h3>Successors</h3><span class="pill">${rows.successors.length}</span></div><div class="dep-v20-list">${rows.successors.length?rows.successors.map(r=>dependencyRowHtml(r,'succ')).join(''):`<div class="dep-v20-empty">No successor selected.</div>`}</div></div></div></div>`
}
function renderProjectDependenciesV18(){
  const code=S.projectWorkspace.code;if(!S.dependency.loadedProjects.has(code)){scheduleDependencyLoad(code,"project");return `<div class="empty"><strong>Loading project dependencies…</strong>Fetching persistent predecessor / successor links.</div>`}
  if(!S.dependency.report&&S.dependency.error)return dependencySetupHtml();
  const rows=S.dependencies.filter(r=>scalar(r[DF.projectCode])===String(code)&&dependencyStatus(r)!=="Closed");
  return `<div class="section-row"><div><h2>Document Dependencies</h2><p>Persistent engineering links for Project ${h(code)}. One design can have unlimited predecessors and successors.</p></div><span class="pill brand">${rows.length} link${rows.length===1?'':'s'}</span></div>${rows.length?`<div class="dep-v20-project">${rows.map(r=>{const pa=depWorkById(scalar(r[DF.predecessorId])),sa=depWorkById(scalar(r[DF.successorId]));return `<div class="dep-v20-project-row"><div class="dep-v20-node"><b>${h(pa?depWorkTitle(pa):dependencyTitleFromRecord(r,'pred'))}</b><span>${h(pa?depWorkSub(pa):'Predecessor')}</span></div><div class="dep-v20-arrow">→</div><div class="dep-v20-node"><b>${h(sa?depWorkTitle(sa):dependencyTitleFromRecord(r,'succ'))}</b><span>${h(sa?depWorkSub(sa):'Successor')}</span></div><div><span class="pill">${h(scalar(r[DF.relationshipType])||'Reference')}</span></div><div><span class="pill blue">${h(scalar(r[DF.linkType])||'FS')}</span></div><div class="tiny muted">${num(r[DF.lagDays])?`${num(r[DF.lagDays])}d lag`:'No lag'}</div></div>`}).join('')}</div>`:`<div class="empty"><strong>No dependencies yet</strong>Open a design work item and use Dependencies → Add Predecessor / Add Successor.</div>`}`;
}
function dependencyCandidateOptions(current){
  const code=scalar(current[AF.projectCode]);return v18ProjectAssignments(code).filter(a=>idOf(a)!==idOf(current)).sort((a,b)=>depWorkTitle(a).localeCompare(depWorkTitle(b))).map(a=>`<option value="${h(idOf(a))}">${h(depWorkTitle(a))} • ${h(assignmentDisplayUser(a))}</option>`).join('')
}
function openDependencyModal(direction){
  const a=S.current;if(!a)return;const isPred=direction==='predecessor';
  openModal(isPred?'Add Predecessor':'Add Successor',`${h(depWorkTitle(a))} • Project ${h(scalar(a[AF.projectCode]))}`,
  `<div class="dep-modal-grid"><div class="field wide"><label>${isPred?'Predecessor Design':'Successor Design'} *</label><select id="v20DepWork"><option value="">Select design work…</option>${dependencyCandidateOptions(a)}</select><div class="hint">Only readable project design work is shown; Creator record IDs are hidden.</div></div><div class="field"><label>Engineering Relationship</label><select id="v20DepRelation">${['Reference','Input Required','Must Follow','Vendor Input','For Information','Change Request','Supersedes'].map(x=>`<option>${h(x)}</option>`).join('')}</select></div><div class="field"><label>Link Type</label><select id="v20DepLink">${['Finish to Start (FS)','Start to Start (SS)','Finish to Finish (FF)','Start to Finish (SF)'].map(x=>`<option>${h(x)}</option>`).join('')}</select></div><div class="field"><label>Lag (Days)</label><input id="v20DepLag" type="number" step="1" value="0"></div><div class="field"><label>Status</label><select id="v20DepStatus"><option>Active</option><option>Closed</option></select></div><div class="field wide"><label>Remark</label><textarea id="v20DepRemark" rows="3" placeholder="Optional dependency note"></textarea></div></div>`,
  `<button class="btn" data-modal="close">Cancel</button><button class="btn primary" data-v20-save-dep="${h(direction)}">Save Dependency</button>`)
}
async function sendDependencyEmail(record){
  if(!CONFIG.NOTIFICATIONS?.enabled)return;const succ=depWorkById(scalar(record[DF.successorId]));if(!succ)return;const recipient=assignmentRecipientFromRecord(succ);if(!recipient.email)return;
  const pred=depWorkById(scalar(record[DF.predecessorId]));const subject=`[Design Control] Dependency Added - ${scalar(record[DF.projectCode])}`;
  const html=`<div style="font-family:Arial,sans-serif;color:#1f2937"><h2 style="color:#c42770">MEGA Engineering - Design Dependency</h2><p>Hello <b>${h(recipient.name)}</b>,</p><p>A dependency was added to your design work.</p><p><b>Predecessor:</b> ${h(pred?depWorkTitle(pred):scalar(record[DF.predecessorTitle]))}<br><b>Successor:</b> ${h(succ?depWorkTitle(succ):scalar(record[DF.successorTitle]))}<br><b>Relationship:</b> ${h(scalar(record[DF.relationshipType]))}<br><b>Link Type:</b> ${h(scalar(record[DF.linkType]))}<br><b>Lag:</b> ${num(record[DF.lagDays])} day(s)</p><p>Please open Drawing &amp; Document Control in Zoho Creator.</p></div>`;
  try{await invokeNotificationCustomApi(recipient,subject,html,'dependency-email')}catch(e){console.warn('Dependency email failed',e)}
}
async function saveDependencyFromModal(direction){
  const current=S.current;if(!current)return;const otherId=$("v20DepWork")?.value;if(!otherId)throw new Error("Select design work.");
  const pred=direction==='predecessor'?depWorkById(otherId):current,succ=direction==='predecessor'?current:depWorkById(otherId);if(!pred||!succ)throw new Error("Selected design work could not be resolved.");
  if(dependencyExists(idOf(pred),idOf(succ)))throw new Error("This dependency already exists.");
  if(dependencyWouldCycle(idOf(pred),idOf(succ)))throw new Error("This link would create a circular dependency. Choose a different predecessor/successor.");
  const p=v18ProjectForCode(scalar(current[AF.projectCode]));const data={
    [DF.projectCode]:scalar(current[AF.projectCode]),[DF.projectRecordId]:p.id||scalar(current[AF.projectRecordId]),
    [DF.predecessorId]:idOf(pred),[DF.predecessorTitle]:depWorkTitle(pred),[DF.successorId]:idOf(succ),[DF.successorTitle]:depWorkTitle(succ),
    [DF.linkType]:$("v20DepLink")?.value||"Finish to Start (FS)",[DF.relationshipType]:$("v20DepRelation")?.value||"Reference",
    [DF.lagDays]:Number($("v20DepLag")?.value||0),[DF.status]:$("v20DepStatus")?.value||"Active",[DF.remark]:$("v20DepRemark")?.value||"",
    [DF.createdByEmail]:employeeEmailFor(S.user)|| (String(S.user||'').includes('@')?String(S.user):''),[DF.createdByName]:v19CurrentUserReadable()
  };
  busy("Saving dependency…");try{const id=await addDependencyRecord(data);const rec={ID:id,...data};S.dependencies.push(rec);closeModal();toast("Dependency saved.","good");await sendDependencyEmail(rec);renderDetailPage()}finally{idle()}
}
function wireV20(){
  document.addEventListener('click',e=>{
    const add=e.target.closest('[data-v20-add-dep]');if(add)return guarded(async()=>{const code=scalar(S.current?.[AF.projectCode]);await loadDependenciesForProject(code);if(!S.dependency.report)throw new Error('Create Design_Dependency and All_Design_Dependencies first. See CREATOR_SETUP.txt.');openDependencyModal(add.dataset.v20AddDep)});
    const save=e.target.closest('[data-v20-save-dep]');if(save)return guarded(()=>saveDependencyFromModal(save.dataset.v20SaveDep));
    const del=e.target.closest('[data-v20-delete-dep]');if(del)return guarded(async()=>{if(!confirm('Remove this dependency?'))return;busy('Removing dependency…');try{await deleteDependencyRecord(del.dataset.v20DeleteDep);toast('Dependency removed.','good');if(S.view==='detail')renderDetailPage();else if(S.view==='project')renderProjectWorkspace()}finally{idle()}})
  });
}


wire();wireV19();wireV20();bootstrap();
</script>
